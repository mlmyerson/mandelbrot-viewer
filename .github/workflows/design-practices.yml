name: Generate Design Practices

on:
  workflow_dispatch:       # run manually from the Actions tab
  push:
    paths:
      - "agent.py"         # re-run whenever the agent script changes

permissions:
  contents: write          # needed to commit design-practices.md back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run design-practices agent
        run: python agent.py

      - name: Commit design-practices.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add design-practices.md
          # Only commit if the file changed
          git diff --cached --quiet || git commit -m "chore: update design-practices.md [skip ci]"
          git push
